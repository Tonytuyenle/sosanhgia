services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vugia
      POSTGRES_USER: vugia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Dat POSTGRES_PASSWORD trong file .env}
    volumes:
      - vugia_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vugia -d vugia"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  app:
    build: .
    ports:
      - "127.0.0.1:4173:4173"
    environment:
      DATABASE_URL: postgresql://vugia:${POSTGRES_PASSWORD}@database:5432/vugia
      HOST: 0.0.0.0
      PORT: 4173
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - vugia_files:/app/data
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
volumes:
  vugia_postgres:
  vugia_files:
